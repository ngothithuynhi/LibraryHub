services:
  postgres:
    image: postgres:15-alpine
    container_name: libraryhub_postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: libraryhub
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: node:20-alpine
    container_name: libraryhub_backend
    working_dir: /app
    volumes:
      - ./Backend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - ./Backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: root
      DB_PASSWORD: 123456
      DB_NAME: libraryhub
      PYTHON_SERVICE: http://python-service:8000
    command: sh -c "npm install && npm start"
    depends_on:
      - postgres
      - python-service

  python-service:
    image: python:3.11-slim
    container_name: libraryhub_python_service
    working_dir: /app
    volumes:
      - ./Backend/python-service:/app
    ports:
      - "8000:8000"
    command: sh -c "pip install -r requirements.txt && uvicorn app:app --host 0.0.0.0 --port 8000"

  frontend:
    image: node:22-alpine
    container_name: libraryhub_frontend
    working_dir: /app
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  postgres_data: